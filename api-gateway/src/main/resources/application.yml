server:
  port: 8080

spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      discovery:
        locator:
          enabled: false   # we define explicit routes below instead of auto-locator magic
      routes:
        - id: flood-service
          uri: lb://flood-service
          predicates:
            - Path=/api/v1/floods/**

        - id: drought-service
          uri: lb://drought-service
          predicates:
            - Path=/api/v1/droughts/**

        - id: fire-service
          uri: lb://fire-service
          predicates:
            - Path=/api/v1/fires/**

        - id: zoonotic-service
          uri: lb://zoonotic-service
          predicates:
            - Path=/api/v1/zoonotic/**

        - id: mining-service
          uri: lb://mining-service
          predicates:
            - Path=/api/v1/mining/**

        - id: auth-service
          uri: lb://auth-service
          predicates:
            - Path=/api/v1/auth/**

        - id: report-service
          uri: lb://report-service
          predicates:
            - Path=/api/v1/reports/**

        - id: alert-service
          uri: lb://alert-service
          predicates:
            - Path=/api/v1/alerts/**

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
  instance:
    prefer-ip-address: true

management:
  endpoints:
    web:
      exposure:
        include: health,info,gateway
