server:
  port: 8082

spring:
  application:
    name: flood-service

  # Default profile uses in-memory H2 so you (and Anesu, and the marker)
  # can run `mvn spring-boot:run` with zero setup. Switch to the `mysql`
  # profile (see application-mysql.yml) once the shared MySQL schema is ready.
  datasource:
    url: jdbc:h2:mem:flooddb;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password: ""

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  h2:
    console:
      enabled: true
      path: /h2-console

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
  instance:
    prefer-ip-address: true

management:
  endpoints:
    web:
      exposure:
        include: health,info

springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /v3/api-docs
