spring.application.name=zoonotic-service
server.port=${ZOONOTIC_SERVICE_PORT:8085}
spring.datasource.url=jdbc:mysql://localhost:3306/zoonotic_disease
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

management.endpoints.web.exposure.include=health,info

eureka.client.service-url.defaultZone=${EUREKA_DEFAULT_ZONE:http://localhost:8761/eureka/}
eureka.instance.prefer-ip-address=true

alert.service.url=${ALERT_SERVICE_URL:http://localhost:8082}

security.jwt.secret=${JWT_SECRET}
security.jwt.expiration-seconds=${JWT_EXPIRATION_SECONDS:900}
security.dev.recorder-ward=${WARD_RECORDER_WARD:Ward 5}
security.dev.recorder-password=${DEV_RECORDER_PASSWORD}
security.dev.supervisor-password=${DEV_SUPERVISOR_PASSWORD}